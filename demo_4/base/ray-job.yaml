# Assisted by Claude Opus
# KubeRay RayJob that runs the same Qwen2.5-3B LoRA SFT as demo_3, but distributed with
# Ray Train instead of a Kubeflow PyTorchJob.
#
# How the pieces fit:
#   - kind: RayJob (ray.io/v1) is reconciled by the KubeRay operator. From rayClusterSpec it
#     stands up an ephemeral Ray cluster (a CPU head + one GPU worker pod holding all 4
#     H100s), runs `entrypoint` as the Ray *driver* on that cluster, then tears the cluster
#     down (shutdownAfterJobFinishes) so the GPUs are freed automatically.
#   - Scaling is owned by Ray Train, not this manifest and not torchrun: fine-tune.py calls
#     TorchTrainer(ScalingConfig(num_workers=4, use_gpu=True)), which launches one worker
#     actor per GPU on the worker pod and sets up the NCCL process group across them.
#   - Dependencies are installed the Ray-native way via runtimeEnvYAML `pip:` — Ray builds a
#     runtime env (a virtualenv that inherits the image's site-packages, so the base torch is
#     NOT reinstalled) on the driver AND every worker actor. This is what gets transformers/
#     trl/peft onto the workers, where train_func actually imports them.
#   - No entrypoint.sh here (demo_3 had one). That script did two things, and in KubeRay both
#     move to Ray-native mechanisms:
#       * pip install  -> runtimeEnvYAML `pip:` below. The HF libs must land on the *worker
#         actors*, not just the launching pod; runtimeEnvYAML propagates to driver + workers,
#         whereas a bash wrapper on the head would not reach the workers.
#       * launch (torchrun) -> spec.entrypoint below. KubeRay injects `ray start ...` as the
#         container command itself, so there is no entrypoint to wrap; the driver runs
#         directly and Ray Train (not torchrun) spawns the ranks.
#     Net: the dependency list lives in this manifest instead of a ConfigMapped script.
#   - The driver script is mounted from a ConfigMap (generated by the overlay from
#     fine-tune.py) at /home/ray/scripts. Model/dataset/adapter live on the demo PVCs:
#       * base model   <- pvc://models   /mnt/models          (read-only, staged by demo_1)
#       * dataset      <- pvc://datasets /mnt/datasets        (read-only, staged by demo_1)
#       * LoRA adapter -> pvc://results  /mnt/results/kuberay (written by this job; sibling of
#                         demo_3's /mnt/results/kubeflow)
#
# NOTE: if fine-tune.py ever exceeds the ~1MB ConfigMap limit, split it across multiple
# ConfigMaps or bake it into a custom image (same caveat as demo_3).
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: qwen-sft-ray
  labels:
    app: qwen-sft-ray
spec:
  # The driver command executed on the head once the cluster is Ready.
  entrypoint: python /home/ray/scripts/fine-tune.py
  # Free the GPUs as soon as the job finishes; keep the cluster ~5 min so logs stay readable.
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 300
  # Per-job runtime environment: installed on the driver and every worker actor. The
  # virtualenv inherits the ray-ml image's packages, so we only add these libs on top.
  #
  # Two image-driven pins we override in the runtime env:
  #   * torch==2.3.1 (CUDA 12.1): BOTH ray-ml gpu tags (2.9.0 and 2.20.0) bundle torch built
  #     for CUDA 11.8 with NCCL 2.14.3 (2022) -- neither is a CUDA-12.1 image. NCCL 2.14.3
  #     cannot build the intra-node topology graph for the 4-GPU H100 layout on these nodes
  #     ("graph/paths.cc: Failed to find reverse path ... nlinks 4"; verified 2026-09-04).
  #     torch 2.3.1's PyPI wheel is
  #     cu121 and bundles nvidia-nccl-cu12==2.20.5 -- the exact NCCL demo_3 used to train on
  #     these same 4xH100s -- and supports sm_90. So the fix is the NCCL version (torch
  #     reinstall), not the ray-ml tag. Paired with 2.20.0 whose base torch is ~2.3.x, this is
  #     a minimal same-minor cu118->cu121 swap.
  #   * pyarrow<14: Ray's own import (ray.data -> pa.PyExtensionType) requires pyarrow<14, but
  #     demo_3's trl==0.12.1 pulls datasets>=2.21 -> pyarrow>=15, breaking Ray. So we pin
  #     trl==0.11.4 (no datasets pin) + datasets==2.19.0 (pyarrow>=12, no upper bound) +
  #     pyarrow<14. transformers/peft/accelerate stay identical to demo_3; the SFTTrainer API
  #     we use is unchanged in trl 0.11.
  runtimeEnvYAML: |
    pip:
      - torch==2.3.1
      - transformers==4.46.3
      - datasets==2.19.0
      - accelerate==1.1.1
      - peft==0.13.2
      - trl==0.11.4
      - "pyarrow<14.0.0"
      - sentencepiece
      - protobuf
    env_vars:
      # Surface NCCL so the multi-GPU collective backend is visible in the worker logs.
      NCCL_DEBUG: INFO
      NCCL_DEBUG_SUBSYS: INIT,NET
  rayClusterSpec:
    rayVersion: "2.20.0"
    # ---- Head: coordination only, no GPU. Runs the driver (fine-tune.py). ----
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-gpus: "0"
      template:
        metadata:
          labels:
            app: qwen-sft-ray
        spec:
          containers:
            - name: ray-head
              # Fully qualified: this cluster enforces registry short-name resolution.
              # NCCL comes from the torch==2.3.1 runtime-env pin, not this image; see runtimeEnvYAML note.
              image: docker.io/rayproject/ray-ml:2.20.0-py310-gpu
              # No command: KubeRay injects `ray start --head ...` itself.
              env:
                - name: HOME
                  value: /tmp
                - name: HF_HOME
                  value: /tmp/hf
                - name: MODEL_PATH
                  value: /mnt/models/Qwen/Qwen2.5-3B-Instruct
                - name: OUTPUT_DIR
                  value: /mnt/results/kuberay
                - name: RAY_STORAGE
                  value: /mnt/results/kuberay/ray-runs
                - name: NUM_WORKERS
                  value: "4"
                - name: MAX_STEPS
                  value: "60"
                - name: BATCH_SIZE
                  value: "8"
                - name: LORA_RANK
                  value: "16"
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              ports:
                - { name: gcs, containerPort: 6379 }
                - { name: dashboard, containerPort: 8265 }
                - { name: client, containerPort: 10001 }
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "4"
                  memory: 16Gi
              volumeMounts:
                - name: scripts
                  mountPath: /home/ray/scripts
                - name: results
                  mountPath: /mnt/results
          volumes:
            - name: scripts
              configMap:
                name: qwen-sft-ray-script
            - name: results
              persistentVolumeClaim:
                claimName: results
    # ---- Workers: one pod holding all 4 H100s; Ray Train places 1 actor per GPU here. ----
    workerGroupSpecs:
      - groupName: gpu-group
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          metadata:
            labels:
              app: qwen-sft-ray
          spec:
            # GPU nodes are tainted nvidia.com/gpu.product=<PRODUCT>:NoSchedule; tolerate the
            # key regardless of value. Requesting 4 GPUs on one pod keeps every Ray Train
            # worker on a single node (intra-node NCCL, no cross-pod rendezvous).
            tolerations:
              - key: nvidia.com/gpu.product
                operator: Exists
                effect: NoSchedule
            containers:
              - name: ray-worker
                image: docker.io/rayproject/ray-ml:2.20.0-py310-gpu
                env:
                  - name: HOME
                    value: /tmp
                  - name: HF_HOME
                    value: /tmp/hf
                  # train_func (running in the worker actor) inherits these from the pod env.
                  - name: MODEL_PATH
                    value: /mnt/models/Qwen/Qwen2.5-3B-Instruct
                  - name: OUTPUT_DIR
                    value: /mnt/results/kuberay
                  - name: RAY_STORAGE
                    value: /mnt/results/kuberay/ray-runs
                  - name: MAX_STEPS
                    value: "60"
                  - name: BATCH_SIZE
                    value: "8"
                  - name: LORA_RANK
                    value: "16"
                  - name: HF_HUB_OFFLINE
                    value: "1"
                  - name: TRANSFORMERS_OFFLINE
                    value: "1"
                # KubeRay sets Ray's --num-cpus from the CPU *limit*. Ray Train's placement
                # group needs 4 GPU bundles on this (only) GPU pod totalling
                # num_workers*resources_per_worker.CPU (4*4=16) PLUS +1 CPU for the Train
                # coordinator that co-locates into the first bundle -> 17 CPU. A limit of 16
                # deadlocks the PG (17 > 16), so we give headroom with 24.
                resources:
                  requests:
                    cpu: "12"
                    memory: 48Gi
                    nvidia.com/gpu: "4"
                  limits:
                    cpu: "24"
                    memory: 96Gi
                    nvidia.com/gpu: "4"
                volumeMounts:
                  - name: models
                    mountPath: /mnt/models
                    readOnly: true
                  - name: datasets
                    mountPath: /mnt/datasets
                    readOnly: true
                  - name: results
                    mountPath: /mnt/results
                  - name: shm
                    mountPath: /dev/shm
            volumes:
              - name: models
                persistentVolumeClaim:
                  claimName: models
              - name: datasets
                persistentVolumeClaim:
                  claimName: datasets
              - name: results
                persistentVolumeClaim:
                  claimName: results
              # NCCL / dataloader shared memory; the default 64Mi /dev/shm is too small.
              - name: shm
                emptyDir:
                  medium: Memory
                  sizeLimit: 16Gi
