# Assisted by Claude Opus
# Kubeflow PyTorchJob that runs the SFTTrainer LoRA fine-tune across the 4 H100s on a
# single GPU node.
#
# How the pieces fit:
#   - kind: PyTorchJob (kubeflow.org/v1) is reconciled by the Kubeflow Training Operator.
#     The *PyTorchJob* owns the scaling: spec.nprocPerNode: "4" tells the operator to run
#     4 worker processes (one per GPU) in the node. The operator exports that as the
#     PET_NPROC_PER_NODE / PET_* elastic-launch env vars, and the container's bare
#     `torchrun` simply consumes them — we do not hand-tune the process count on the
#     command line. A single Master replica requesting 4 GPUs keeps all workers on one
#     node (no cross-pod rendezvous needed).
#   - The training script is mounted from a ConfigMap (generated by kustomize from
#     base/fine-tune.py) at /scripts; nothing is baked into an image. The base model,
#     dataset, and adapter output all live on the demo PVCs:
#       * base model   <- pvc://models   /mnt/models          (read-only, staged by demo_1)
#       * dataset      <- pvc://datasets /mnt/datasets        (read-only, staged by demo_1)
#       * LoRA adapter -> pvc://results  /mnt/results/kubeflow (written by this job; the
#                         per-framework subfolder keeps it separate from demo_4's kuberay run)
#
# The concrete script filename and dataset path come from the overlay (SCRIPT_NAME,
# DATASET_PATH env vars).
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen-sft
  labels:
    app: qwen-sft
spec:
  # The job — not the container command — decides how many workers/GPUs to use.
  nprocPerNode: "4"
  runPolicy:
    # Keep the finished pod around so its logs stay readable until cleanup.
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: qwen-sft
        spec:
          # GPU nodes are tainted nvidia.com/gpu.product=<PRODUCT>:NoSchedule; tolerate the
          # key regardless of value so the trainer can schedule onto them. Requesting 4 GPUs
          # forces the pod onto one node with all 4 H100s.
          tolerations:
            - key: nvidia.com/gpu.product
              operator: Exists
              effect: NoSchedule
          containers:
            - name: pytorch
              # Fully qualified: this cluster enforces registry short-name resolution.
              image: docker.io/pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
              # entrypoint.sh (from the mounted ConfigMap) installs the training stack and
              # hands off to torchrun. The process/GPU count is not set there either — it
              # comes from the PyTorchJob (spec.nprocPerNode -> PET_NPROC_PER_NODE).
              command:
                - /bin/bash
                - /scripts/entrypoint.sh
              env:
                # Stable across overlays; the overlay adds SCRIPT_NAME and DATASET_PATH.
                - name: MODEL_PATH
                  value: /mnt/models/Qwen/Qwen2.5-3B-Instruct
                # Per-framework subfolder on the results PVC (demo_4 uses /mnt/results/kuberay).
                - name: OUTPUT_DIR
                  value: /mnt/results/kubeflow
                - name: MAX_STEPS
                  value: "60"
                - name: BATCH_SIZE
                  value: "8"
                - name: LORA_RANK
                  value: "16"
                # Everything is on-disk already — don't reach out to the HF hub.
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: HF_HOME
                  value: /tmp/hf
                # Surface NCCL in the logs so the multi-GPU collective backend is visible:
                # INIT shows the communicator/ring setup across the 4 ranks, NET the chosen
                # transport (NVLink/P2P/SHM vs network).
                - name: NCCL_DEBUG
                  value: INFO
                - name: NCCL_DEBUG_SUBSYS
                  value: INIT,NET
              resources:
                requests:
                  cpu: "8"
                  memory: 48Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "16"
                  memory: 96Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: models
                  mountPath: /mnt/models
                  readOnly: true
                - name: datasets
                  mountPath: /mnt/datasets
                  readOnly: true
                - name: results
                  mountPath: /mnt/results
                - name: scripts
                  mountPath: /scripts
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: models
            - name: datasets
              persistentVolumeClaim:
                claimName: datasets
            - name: results
              persistentVolumeClaim:
                claimName: results
            - name: scripts
              configMap:
                name: qwen-sft-script
            # NCCL / dataloader shared memory; the default 64Mi /dev/shm is too small.
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
