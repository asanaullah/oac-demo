# demo_6 agent workload: a minimal A2A agent that Rossoctl can onboard.
#
# The container is a stock python image running agent.py (mounted from the
# ConfigMap). agent.py serves the A2A agent card at the well-known path AND
# answers a JSON-RPC message/send POST with a Task ack — so the demo can prove
# the agent both advertises itself (discovery) and receives calls (data plane).
#
# rossoctl.io/type is intentionally NOT set here: a cluster
# ValidatingAdmissionPolicy forbids users from setting it; the Rossoctl operator
# stamps rossoctl.io/type=agent itself when it reconciles the AgentRuntime.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-agent-card
data:
  # A2A AgentCard document, served verbatim at the well-known path.
  agent-card.json: |
    {
      "protocolVersion": "0.3.0",
      "name": "weather-agent",
      "description": "Demo weather agent onboarded to rossoctl",
      "url": "http://weather-agent:8080/",
      "version": "1.0.0",
      "capabilities": { "streaming": false, "pushNotifications": false },
      "defaultInputModes": ["text"],
      "defaultOutputModes": ["text"],
      "skills": [
        {
          "id": "get-weather",
          "name": "Get weather",
          "description": "Return the current weather for a city",
          "tags": ["weather", "demo"]
        }
      ]
    }
  # A2A agent server: serves the card at the well-known path AND answers a
  # JSON-RPC message/send POST with a Task ack, printing a receipt marker to
  # stdout so the demo can prove the agent received + acknowledged the request.
  agent.py: |
    import json, sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CARD_PATH = "/opt/agent/.well-known/agent-card.json"

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body, ctype="application/json"):
            data = body if isinstance(body, bytes) else body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            path = self.path.split("?")[0]
            if path in ("/.well-known/agent-card.json", "/.well-known/agent.json"):
                try:
                    with open(CARD_PATH, "rb") as f:
                        self._send(200, f.read())
                except OSError:
                    self._send(404, '{"error":"card not found"}')
            else:
                self._send(404, '{"error":"not found"}')

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            raw = self.rfile.read(length) if length else b""
            try:
                req = json.loads(raw or b"{}")
            except ValueError:
                req = {}
            rpc_id = req.get("id", 1)
            method = req.get("method", "")
            # Proof-of-receipt marker (the demo greps this in the pod log).
            print("A2A REQUEST RECEIVED method=%s id=%s" % (method, rpc_id), flush=True)
            result = {
                "jsonrpc": "2.0",
                "id": rpc_id,
                "result": {
                    "kind": "task",
                    "id": "task-%s" % rpc_id,
                    "status": {"state": "completed"},
                    "artifacts": [
                        {"parts": [{"kind": "text",
                                    "text": "ack: received %s, agent acknowledges the request" % method}]}
                    ],
                },
            }
            self._send(200, json.dumps(result))

        def log_message(self, fmt, *args):
            # Route access logs to stdout so oc logs surfaces them.
            sys.stdout.write("%s - %s\n" % (self.address_string(), fmt % args))
            sys.stdout.flush()

    if __name__ == "__main__":
        port = int(sys.argv[1]) if len(sys.argv) > 1 else 8080
        HTTPServer(("", port), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-agent
  labels:
    app.kubernetes.io/name: weather-agent
    # The sync controller keys off the workload's top-level labels; the A2A
    # protocol marker goes here so the operator notices the agent.
    protocol.rossoctl.io/a2a: ""
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-agent
        rossoctl.io/inject: "disabled"   # discovery demo: no sidecar injection
    spec:
      containers:
        - name: agent
          image: registry.access.redhat.com/ubi9/python-311:latest
          # A small stdlib A2A server: serves the card at the well-known path and
          # answers a JSON-RPC message/send POST with a Task ack (see agent.py).
          command: ["/bin/sh", "-c"]
          args: ["exec python3 /opt/agent/agent.py 8080"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: card
              mountPath: /opt/agent/.well-known/agent-card.json
              subPath: agent-card.json
            - name: card
              mountPath: /opt/agent/.well-known/agent.json   # legacy path too
              subPath: agent-card.json
            - name: card
              mountPath: /opt/agent/agent.py
              subPath: agent.py
          readinessProbe:
            httpGet: { path: /.well-known/agent-card.json, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: card
          configMap:
            name: weather-agent-card
---
apiVersion: v1
kind: Service
metadata:
  name: weather-agent
  labels:
    app.kubernetes.io/name: weather-agent
spec:
  selector:
    app.kubernetes.io/name: weather-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
